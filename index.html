<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>For Barsa 🌌</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Raleway:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#000d1a;min-height:100vh;overflow:hidden;font-family:'Raleway',sans-serif;color:#e0fff8;cursor:none}
    canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none}
    .cur{position:fixed;z-index:9999;width:14px;height:14px;border-radius:50%;background:rgba(80,255,200,.8);pointer-events:none;transform:translate(-50%,-50%)}
    .scene{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:clamp(12px,2.5vh,24px)}
    .title{font-family:'Dancing Script',cursive;font-size:clamp(3rem,11vw,7rem);font-weight:700;background:linear-gradient(135deg,#80ffcc,#40e0d0,#60d0ff,#b060ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:fup 2s ease forwards 2.5s}
    .sub{font-size:clamp(.7rem,2vw,.95rem);letter-spacing:.4em;text-transform:uppercase;color:rgba(120,255,210,.45);opacity:0;animation:fup 1s ease forwards 4.8s}
    .hw{opacity:0;animation:fup .8s ease forwards 5.6s}
    .hi{font-size:clamp(2rem,6vw,3.2rem);display:inline-block;animation:aurora 4s ease-in-out infinite 5.6s}
    .mw{max-width:min(560px,90vw);opacity:0;animation:fup 1.2s ease forwards 6.6s}
    .msg{font-size:clamp(.86rem,2.3vw,1.08rem);font-weight:300;line-height:2;color:rgba(200,255,240,.8)}
    .msg em{color:#80ffcc;font-style:italic}
    .msg strong{color:#b0ffe8}
    .btn{opacity:0;animation:fup .8s ease forwards 9.4s;background:transparent;border:1.5px solid rgba(80,220,180,.5);color:#e0fff8;font-family:'Raleway',sans-serif;font-size:clamp(.78rem,2vw,.9rem);font-weight:500;letter-spacing:.22em;text-transform:uppercase;padding:13px 38px;border-radius:50px;cursor:pointer;backdrop-filter:blur(8px);transition:all .3s}
    .btn:hover{border-color:rgba(80,255,200,.9);box-shadow:0 0 24px rgba(60,200,160,.5);transform:translateY(-2px)}
    .ds{position:fixed;bottom:16px;right:18px;font-size:.68rem;letter-spacing:.15em;color:rgba(100,255,200,.25);z-index:20;opacity:0;animation:fi 1s ease forwards 12s}
    @keyframes fup{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fi{to{opacity:1}}
    @keyframes aurora{0%,100%{filter:hue-rotate(0deg) drop-shadow(0 0 12px rgba(80,255,200,.6))}50%{filter:hue-rotate(60deg) drop-shadow(0 0 20px rgba(80,200,255,.8))}}
  </style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="cur" id="cur"></div>
<div class="scene">
  <div class="title">Barsa</div>
  <div class="sub">as rare as the northern lights</div>
  <div class="hw"><span class="hi">🌌</span></div>
  <div class="mw"><p class="msg">
    The northern lights don't appear every night —<br>
    <em>they are rare, and for that, more beautiful.</em><br><br>
    You are like that.<br>
    <strong>Something so uncommon, so stunning,</strong><br>
    that when you show up,<br>
    the whole sky changes.<br><br>
    <em>Barsa</em>, you are my northern light.
  </p></div>
  <button class="btn" id="btn" onclick="sendLove()">🌌 Dance with Me 🌌</button>
</div>
<div class="ds">November 07 · 2026</div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W=cv.width=window.innerWidth,H=cv.height=window.innerHeight;
let t=0;
const BANDS=[
  {col:'rgba(40,255,160,',y:.15,amp:.08,freq:.6,speed:.0004},
  {col:'rgba(40,200,255,',y:.25,amp:.06,freq:.8,speed:.0006},
  {col:'rgba(140,60,255,',y:.10,amp:.10,freq:.5,speed:.0003},
  {col:'rgba(80,255,220,',y:.20,amp:.07,freq:.7,speed:.0005},
];
function drawAurora(){
  BANDS.forEach(b=>{
    for(let i=0;i<3;i++){
      const yBase=H*b.y+i*H*.04;
      const op=(.06-i*.015)+Math.sin(t*b.speed*1000+i)*0.02;
      ctx.beginPath();
      ctx.moveTo(0,yBase);
      for(let x=0;x<=W;x+=6){
        const y=yBase+Math.sin(x*b.freq*.01+t*b.speed*1000)*H*b.amp+Math.sin(x*.02+t*b.speed*800)*(H*b.amp*.4);
        ctx.lineTo(x,y);
      }
      ctx.lineTo(W,0);ctx.lineTo(0,0);ctx.closePath();
      const g=ctx.createLinearGradient(0,0,0,H*.5);
      g.addColorStop(0,b.col+'0)');
      g.addColorStop(.5,b.col+op+')');
      g.addColorStop(1,b.col+'0)');
      ctx.fillStyle=g;ctx.fill();
    }
  });
}
const stars2=Array.from({length:200},()=>{return{x:Math.random()*W,y:Math.random()*H*.6,r:Math.random()*1.5+.3,op:Math.random()*.6+.2,tp:Math.random()*Math.PI*2,ts:Math.random()*.02+.005}});
function loop(ts){t=ts/1000;ctx.clearRect(0,0,W,H);stars2.forEach(s=>{s.tp+=s.ts;const o=s.op+Math.sin(s.tp)*.2;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${o})`;ctx.fill()});drawAurora();requestAnimationFrame(loop)}
loop(0);
const cur=document.getElementById('cur');
document.addEventListener('mousemove',e=>{cur.style.left=e.clientX+'px';cur.style.top=e.clientY+'px'});
function sendLove(){const btn=document.getElementById('btn');btn.textContent='💚 You Are My Aurora 💚';setTimeout(()=>btn.textContent='🌌 Dance with Me 🌌',3000)}
window.addEventListener('resize',()=>{W=cv.width=window.innerWidth;H=cv.height=window.innerHeight});
</script>
</body>
</html>
